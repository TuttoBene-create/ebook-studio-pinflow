<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ebook Studio PinFlow</title>
    <style>
        body {
            background-color: #101828;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            color: #00D4FF;
            font-size: 2.5em;
            margin-bottom: 0.2em;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 2em;
            max-width: 600px;
            line-height: 1.6;
        }
        a {
            color: #00D4FF;
            text-decoration: none;
            border: 2px solid #00D4FF;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s, color 0.3s;
        }
        a:hover {
            background-color: #00D4FF;
            color: #101828;
        }
        .footer {
            margin-top: 4em;
            font-size: 0.9em;
            color: #888;
        }
        .footer a {
            border: none;
            padding: 0;
            font-weight: normal;
            text-decoration: underline;
        }
        .footer a:hover {
            background-color: transparent;
            color: #FFFFFF;
        }
    </style>
</head>
<body>
    <h1>Ebook Studio PinFlow</h1>
    <p>Publishing practical e-books for first-time managers.</p>
    
    <a href="https://www.amazon.com/dp/B0HQ7HRYHQ" target="_blank">View our latest book on Amazon</a>

    <div class="footer">
        <p>&copy; 2026 Ebook Studio PinFlow. All rights reserved.</p>
        <p><a href="https://tuttobene-create.github.io/privacy/" target="_blank">Privacy Policy</a></p>
    </div>
</body>
</html>
