<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mike Skylan | Author</title>
  <style>
    :root {
      --navy: #101828;
      --cyan: #00D4FF;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: clamp(1.25rem, 5vw, 3rem);
      background: var(--navy);
      color: var(--white);
      font: 1rem/1.5 system-ui, sans-serif;
    }
    .page { width: min(100%, 48rem); }
    header, footer { text-align: center; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.15; }
    header p { margin: 0.75rem 0 2rem; }
    .books {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }
    .book {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.5rem;
      padding: 1.25rem;
      border: 1px solid var(--cyan);
      border-radius: 0.75rem;
      color: var(--white);
      font-size: 1.125rem;
      text-decoration: none;
    }
    .book span, footer a { color: var(--cyan); }
    .book span { font-size: 0.875rem; }
    .book:hover, .book:focus-visible { background: var(--cyan); color: var(--navy); }
    .book:hover span, .book:focus-visible span { color: inherit; }
    a:focus-visible { outline: 2px solid var(--white); outline-offset: 4px; }
    footer { margin-top: 2rem; }
    @media (max-width: 38rem) {
      .books { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Mike Skylan | Author</h1>
      <p>Practical guides for managers and families</p>
    </header>
    <main class="books" aria-label="Books">
      <a class="book" href="https://www.amazon.com/dp/B0HQ7HRYHQ">
        <strong>Managing Former Peers</strong>
        <span>View on Amazon</span>
      </a>
      <a class="book" href="https://www.amazon.com/dp/B0HRLC23YB">
        <strong>From Shoebox to Family Album</strong>
        <span>View on Amazon</span>
      </a>
    </main>
    <footer>
      <a href="https://tuttobene-create.github.io/privacy/">Privacy Policy</a>
    </footer>
  </div>
</body>
</html>
